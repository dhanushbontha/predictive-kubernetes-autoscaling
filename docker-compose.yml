version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: predictive-k8s-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoscaling_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoscaling_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - autoscaling-net

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: predictive-k8s-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./k8s/monitoring/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    networks:
      - autoscaling-net

  forecasting-service:
    build:
      context: ./forecasting-service
      dockerfile: Dockerfile
    container_name: predictive-k8s-forecasting
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - WORKLOAD_METRIC_QUERY=sum(rate(http_server_requests_seconds_count{uri="/api/workload"}[1m]))
      - SCRAPE_LOOKBACK_MINUTES=15
      - SCRAPE_STEP_SECONDS=5
      - TRAINING_INTERVAL_SECONDS=30
      - FORECAST_HORIZON_SECONDS=60
      - LOG_LEVEL=INFO
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - autoscaling-net

  workload-service:
    build:
      context: ./workload-service
      dockerfile: Dockerfile
    container_name: predictive-k8s-workload
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - WORKLOAD_DEFAULT_ITERATIONS=100000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - autoscaling-net

  experiment-backend:
    build:
      context: ./experiment-backend
      dockerfile: Dockerfile
    container_name: predictive-k8s-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/autoscaling_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - PROMETHEUS_BASE_URL=http://prometheus:9090
      - FORECASTING_SERVICE_URL=http://forecasting-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - autoscaling-net

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: predictive-k8s-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - experiment-backend
    networks:
      - autoscaling-net

networks:
  autoscaling-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
