# ==============================================================================
# Helm values for kube-prometheus-stack deployment in autoscaling experiments
# ==============================================================================
prometheus:
  prometheusSpec:
    # Match any ServiceMonitor regardless of release label
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    scrapeInterval: "5s"
    evaluationInterval: "5s"
    retention: "1d"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

alertmanager:
  enabled: false

grafana:
  enabled: true
  adminPassword: "admin"
  service:
    type: ClusterIP
    port: 80
