apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: workload-service-monitor
  labels:
    app: workload-service
    release: prometheus
    app.kubernetes.io/name: workload-service
    app.kubernetes.io/part-of: predictive-kubernetes-autoscaling
spec:
  selector:
    matchLabels:
      app: workload-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 5s
      scrapeTimeout: 4s
      metricRelabelings:
        # Keep metrics clean and ensure labels are standard
        - sourceLabels: [__name__]
          regex: "(http_server_requests_seconds.*|jvm_memory_.*|process_cpu_.*|system_cpu_.*)"
          action: keep
