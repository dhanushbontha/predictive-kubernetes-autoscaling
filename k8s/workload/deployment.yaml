apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-service
  namespace: autoscaling-experiment
  labels:
    app: workload-service
    app.kubernetes.io/name: workload-service
    app.kubernetes.io/part-of: predictive-kubernetes-autoscaling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: workload-service
        app.kubernetes.io/name: workload-service
        app.kubernetes.io/part-of: predictive-kubernetes-autoscaling
    spec:
      containers:
        - name: workload-service
          image: predictive-k8s/workload-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: WORKLOAD_DEFAULT_ITERATIONS
              value: "100000"
