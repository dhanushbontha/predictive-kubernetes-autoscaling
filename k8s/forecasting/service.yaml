apiVersion: v1
kind: Service
metadata:
  name: forecasting-service
  namespace: autoscaling-experiment
  labels:
    app: forecasting-service
    tier: forecasting
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: forecasting-service
  ports:
    - name: http-metrics
      port: 8000
      targetPort: 8000
      protocol: TCP
