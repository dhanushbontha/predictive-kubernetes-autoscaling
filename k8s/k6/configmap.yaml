apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-workload-scripts
  namespace: autoscaling-experiment
  labels:
    app.kubernetes.io/name: k6-load-test
    app.kubernetes.io/part-of: predictive-kubernetes-autoscaling
data:
  stable.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    const TARGET_URL = __ENV.TARGET_URL || 'http://workload-service:8084';
    const TARGET_RPS = parseInt(__ENV.TARGET_RPS || '30', 10);
    const DURATION = __ENV.DURATION || '5m';

    export const options = {
        scenarios: {
            stable_workload: {
                executor: 'constant-arrival-rate',
                rate: TARGET_RPS,
                timeUnit: '1s',
                duration: DURATION,
                preAllocatedVUs: Math.max(10, Math.floor(TARGET_RPS * 1.5)),
                maxVUs: Math.max(50, TARGET_RPS * 4),
            },
        },
        thresholds: {
            http_req_failed: ['rate<0.05'],
        },
    };

    export default function () {
        const url = `${TARGET_URL}/api/workload`;
        const res = http.get(url, {
            tags: { scenario: 'stable' },
            timeout: '10s',
        });

        check(res, {
            'status is 200': (r) => r.status === 200,
            'response contains expected text': (r) => r.body && r.body.includes('Workload processed'),
        });
    }

  periodic.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    const TARGET_URL = __ENV.TARGET_URL || 'http://workload-service:8084';
    const PEAK_RPS = parseInt(__ENV.TARGET_RPS || '60', 10);
    const BASE_RPS = Math.max(5, Math.floor(PEAK_RPS * 0.2));

    export const options = {
        scenarios: {
            periodic_workload: {
                executor: 'ramping-arrival-rate',
                startRate: BASE_RPS,
                timeUnit: '1s',
                preAllocatedVUs: Math.max(10, Math.floor(PEAK_RPS * 1.5)),
                maxVUs: Math.max(50, PEAK_RPS * 4),
                stages: [
                    { target: PEAK_RPS, duration: '1m' },
                    { target: BASE_RPS, duration: '1m' },
                    { target: PEAK_RPS, duration: '1m' },
                    { target: BASE_RPS, duration: '1m' },
                    { target: PEAK_RPS, duration: '1m' },
                    { target: BASE_RPS, duration: '1m' },
                ],
            },
        },
        thresholds: {
            http_req_failed: ['rate<0.05'],
        },
    };

    export default function () {
        const url = `${TARGET_URL}/api/workload`;
        const res = http.get(url, {
            tags: { scenario: 'periodic' },
            timeout: '10s',
        });

        check(res, {
            'status is 200': (r) => r.status === 200,
            'response contains expected text': (r) => r.body && r.body.includes('Workload processed'),
        });
    }

