apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  labels:
    app: k6-load-test
    app.kubernetes.io/name: k6-load-test
    app.kubernetes.io/part-of: predictive-kubernetes-autoscaling
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: k6-load-test
        app.kubernetes.io/name: k6-load-test
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          imagePullPolicy: IfNotPresent
          args:
            - "run"
            - "/scripts/stable.js"
          env:
            - name: TARGET_URL
              value: "http://workload-service:8084"
            - name: TARGET_RPS
              value: "30"
            - name: DURATION
              value: "5m"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: k6-scripts-volume
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: k6-scripts-volume
          configMap:
            name: k6-workload-scripts
            defaultMode: 0777
