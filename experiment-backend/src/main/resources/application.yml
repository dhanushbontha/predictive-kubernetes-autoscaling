server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: experiment-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:autoscaling_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

app:
  kubernetes:
    namespace: autoscaling-experiment
    workload-deployment: workload-service
    workload-service: workload-service
    k6-configmap: k6-workload-scripts
  prometheus:
    url: ${PROMETHEUS_URL:http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090}
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
  forecasting:
    url: ${FORECASTING_URL:http://forecasting-service:8000}
