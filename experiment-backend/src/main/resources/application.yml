server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: experiment-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/autoscaling_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

app:
  kubernetes:
    namespace: autoscaling-experiment
    workload-deployment: workload-service
    workload-service: workload-service
    k6-configmap: k6-workload-scripts
  prometheus:
    url: ${PROMETHEUS_URL:http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090}
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
  forecasting:
    url: ${FORECASTING_URL:http://forecasting-service:8000}
