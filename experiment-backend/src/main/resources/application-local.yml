# Optional Local Development Profile (--spring.profiles.active=local)
# Used only when running locally without a PostgreSQL instance.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:autoscaling_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

app:
  mode: dev

